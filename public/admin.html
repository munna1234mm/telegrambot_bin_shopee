<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin Shopee - Admin Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* Admin specific styles */
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .app-container {
            max-width: 900px;
        }

        .header-title {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .sidebar {
            background: var(--glass-bg);
            border-radius: 15px;
            padding: 20px;
        }

        .menu-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover,
        .menu-item.active {
            background: rgba(0, 136, 204, 0.2);
            color: var(--primary-dark);
            font-weight: bold;
        }

        .main-panel {
            background: var(--glass-bg);
            border-radius: 15px;
            padding: 20px;
            min-height: 500px;
        }

        .panel-content {
            display: none;
        }

        .panel-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .user-list {
            list-style: none;
            padding: 0;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .user-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-details h5 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .user-details p {
            margin: 0;
            font-size: 0.85rem;
            color: #555;
        }

        .verified-badge {
            color: green;
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <h2 class="header-title"><i class="fa-solid fa-user-shield"></i> Bin Shopee Admin Panel</h2>

        <div class="admin-grid">
            <div class="sidebar glassmorphism">
                <div class="menu-item active" data-target="updates-panel">
                    <i class="fa-solid fa-cart-plus"></i> Add New Product
                </div>
                <div class="menu-item" data-target="users-panel">
                    <i class="fa-solid fa-users"></i> Manage Users
                </div>
                <div class="menu-item" style="margin-top: auto; color: var(--error-color);">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </div>
            </div>

            <div class="main-panel glassmorphism">

                <!-- Updates Panel -->
                <div id="updates-panel" class="panel-content active">
                    <h3>Add New Product</h3>
                    <p class="subtitle">Publish a new product to the Mini App dashboard.</p>

                    <form id="updateForm" style="margin-top: 20px;">
                        <div class="form-group">
                            <label for="updateTitle">Product Name *</label>
                            <input type="text" id="updateTitle" class="form-control"
                                placeholder="e.g., Netflix Premium 1 Month" required>
                        </div>
                        <div class="form-group">
                            <label for="updatePrice">Price (USDT) *</label>
                            <input type="number" step="0.01" id="updatePrice" class="form-control"
                                placeholder="e.g., 2.50" required>
                        </div>
                        <div class="form-group">
                            <label for="updateImageUrl">Image URL</label>
                            <input type="url" id="updateImageUrl" class="form-control"
                                placeholder="e.g., https://example.com/image.png">
                        </div>
                        <div class="form-group">
                            <label for="updateContent">Description</label>
                            <textarea id="updateContent" class="form-control" placeholder="Describe the product..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="updateCopyText">Optional: Copy Button Text</label>
                            <input type="text" id="updateCopyText" class="form-control"
                                placeholder="e.g., Copy Promo Code">
                        </div>
                        <div class="form-group">
                            <label for="updateCopyValue">Optional: Value to Copy</label>
                            <input type="text" id="updateCopyValue" class="form-control"
                                placeholder="e.g., PROMO2024">
                        </div>
                        <button type="submit" id="postBtn" class="btn btn-primary">
                            <span>Publish Product</span> <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                    <div id="postMsg" class="message"></div>
                </div>

                <!-- Users Panel -->
                <div id="users-panel" class="panel-content">
                    <h3>Registered Users</h3>
                    <p class="subtitle">Users who have interacted with the bot and verified.</p>
                    <button id="refreshUsersBtn" class="btn btn-secondary"
                        style="width: auto; padding: 8px 15px; margin-bottom: 15px;">
                        <i class="fa-solid fa-rotate-right"></i> Refresh
                    </button>
                    <ul class="user-list" id="usersListContainer">
                        <li>Loading users...</li>
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuItems = document.querySelectorAll('.menu-item[data-target]');
            const panels = document.querySelectorAll('.panel-content');

            // Tab Switching
            menuItems.forEach(item => {
                item.addEventListener('click', () => {
                    menuItems.forEach(m => m.classList.remove('active'));
                    panels.forEach(p => p.classList.remove('active'));

                    item.classList.add('active');
                    document.getElementById(item.dataset.target).classList.add('active');

                    if (item.dataset.target === 'users-panel') {
                        loadUsers();
                    }
                });
            });

            // Add Item Submit
            const updateForm = document.getElementById('updateForm');
            const postBtn = document.getElementById('postBtn');
            const postMsg = document.getElementById('postMsg');

            updateForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('updateTitle').value.trim();
                const price = document.getElementById('updatePrice').value.trim();
                const imageUrl = document.getElementById('updateImageUrl').value.trim();
                const description = document.getElementById('updateContent').value.trim();
                const copyBtnText = document.getElementById('updateCopyText').value.trim();
                const copyBtnValue = document.getElementById('updateCopyValue').value.trim();

                postBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Posting...';
                postBtn.disabled = true;

                try {
                    const res = await fetch('/api/admin/items', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, price, description, copyBtnText, copyBtnValue, imageUrl })
                    });
                    const data = await res.json();

                    postMsg.textContent = data.message;
                    postMsg.className = data.success ? 'message success' : 'message error';
                    if (data.success) updateForm.reset();
                } catch (error) {
                    postMsg.textContent = 'Error adding product.';
                    postMsg.className = 'message error';
                } finally {
                    postBtn.innerHTML = '<span>Publish Product</span> <i class="fa-solid fa-paper-plane"></i>';
                    postBtn.disabled = false;
                }
            });

            // Load Users
            const refreshUsersBtn = document.getElementById('refreshUsersBtn');
            refreshUsersBtn.addEventListener('click', loadUsers);

            async function loadUsers() {
                const container = document.getElementById('usersListContainer');
                container.innerHTML = '<li><i class="fa-solid fa-spinner fa-spin"></i> Loading users...</li>';

                try {
                    const res = await fetch('/api/admin/users');
                    const data = await res.json();

                    if (data.success && data.users.length > 0) {
                        container.innerHTML = '';
                        // Sort by latest active
                        data.users.sort((a, b) => new Date(b.lastActive || 0) - new Date(a.lastActive || 0));

                        data.users.forEach(user => {
                            const li = document.createElement('li');
                            li.className = 'user-item';
                            li.innerHTML = `
                                <img src="${user.photoUrl || 'https://via.placeholder.com/50'}" alt="User">
                                <div class="user-details">
                                    <h5>${user.name || 'Unknown'}</h5>
                                    <p>ID: ${user.chatId}</p>
                                    ${user.verified ? '<div class="verified-badge"><i class="fa-solid fa-check-circle"></i> Verified</div>' : '<div style="color:red; font-size:0.8rem;">Unverified</div>'}
                                </div>
                            `;
                            container.appendChild(li);
                        });
                    } else {
                        container.innerHTML = '<li>No users found yet.</li>';
                    }
                } catch (err) {
                    container.innerHTML = '<li style="color:red;">Error loading users. Check console.</li>';
                }
            }
        });
    </script>
</body>

</html>
